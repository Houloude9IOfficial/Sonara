name: Production release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to update (leave empty to build only)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sonara-release-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows production
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install packaging tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          choco install innosetup --yes --no-progress
      - name: Check Windows host and shared UI
        shell: pwsh
        run: |
          cargo test --workspace
          Push-Location apps/sonara
          flutter pub get
          flutter analyze
          flutter test
          Pop-Location
      - name: Build and package
        shell: pwsh
        run: ./tools/packaging/build-release.ps1 -Platform Windows
      - uses: actions/upload-artifact@v4
        with:
          name: Sonara-Windows-Setup-EXE
          if-no-files-found: error
          path: |
            dist/Sonara-*-windows-x64-setup.exe
            dist/Sonara-*-windows-x64-setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Sonara-Windows-Portable-ZIP
          if-no-files-found: error
          path: |
            dist/Sonara-*-windows-x64-portable.zip
            dist/Sonara-*-windows-x64-portable.zip.sha256

  android:
    name: Android production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install Rust Android builder
        run: cargo install cargo-ndk --locked
      - name: Configure Android release signing
        working-directory: apps/sonara/android
        env:
          KEYSTORE_BASE64: ${{ secrets.SONARA_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SONARA_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SONARA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SONARA_ANDROID_KEY_PASSWORD }}
          REGISTERED_CERT_SHA256: ${{ vars.SONARA_ANDROID_REGISTERED_CERT_SHA256 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" || -z "$REGISTERED_CERT_SHA256" ]]; then
            echo 'Android release-signing secrets are not configured.' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-key.jks
          actual_fingerprint="$(keytool -list -v -keystore release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected_fingerprint="$(printf '%s' "$REGISTERED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$actual_fingerprint" || "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo 'The CI signing certificate does not match SONARA_ANDROID_REGISTERED_CERT_SHA256.' >&2
            exit 1
          fi
          {
            echo 'storeFile=release-key.jks'
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
      - name: Test Flutter application
        working-directory: apps/sonara
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build and package
        shell: pwsh
        run: ./tools/packaging/build-release.ps1 -Platform Android
      - uses: actions/upload-artifact@v4
        with:
          name: Sonara-Android-Installer-APK
          if-no-files-found: error
          path: |
            dist/Sonara-*-android.apk
            dist/Sonara-*-android.apk.sha256

  macos:
    name: macOS Apple Silicon production
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Check Flutter UI and Rust host
        run: |
          cargo test --workspace
          cd apps/sonara
          flutter pub get
          flutter analyze
          flutter test
      - name: Build and package
        shell: bash
        run: bash tools/packaging/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Sonara-macOS-Installer-DMG
          if-no-files-found: error
          path: |
            dist/Sonara-*-macos-arm64.dmg
            dist/Sonara-*-macos-arm64.dmg.sha256

  publish:
    name: Attach production builds to release
    needs: [windows, android, macos]
    if: >-
      ${{ always() && needs.windows.result == 'success' &&
          needs.android.result == 'success' && needs.macos.result == 'success' &&
          (github.event_name == 'release' || inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Upload or replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
