[workspace]
resolver = "2"
members = ["crates/engine", "apps/cli", "crates/android-receiver"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
jni = "0.21"
libloading = "0.8"
quinn = "0.11"
rand = "0.9"
rcgen = { version = "0.14", features = ["pem", "crypto", "aws_lc_rs"] }
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time", "signal", "fs", "net", "io-util", "sync"] }
toml = "0.9"
uuid = { version = "1.18", features = ["v4", "serde"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
] }
